name: Analyze C12 inherited base Parse contracts

on:
  workflow_dispatch:
  push:
    branches: [analysis/server-contracts-11.6.3]
    paths:
      - '.github/workflows/analyze-inherited-base-contracts.yml'
      - 'scripts/analyze-inherited-base-contracts.py'

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      C6_ARTIFACT_ID: '9924013286'
      C6_ARTIFACT_SHA256: '5493b811ba7d08f28702d3f1f9bc32e3790a5540f1005aca95fde3cdc424d1fe'
      C6_SQLITE_SHA256: '4c623a2d2ac7e6b5968d907c292160e52b25dee0355bf7041d436a38e77daedb'
      C11_ARTIFACT_ID: '9924573487'
      C11_ARTIFACT_SHA256: '909f8ad90d4823b502a01d95e38251a8c63e116044b5c40287b99cfeb9976821'
      C11_JSON_SHA256: 'ed1b71de04a901f6a96d39f9f5f5e6877c5092be96478838bbf6945af79b3671'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Fetch fixed semantic inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/c6 work/c11 work/xapk work/dumper work/dump reports
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -o work/c6.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C6_ARTIFACT_ID}/zip"
          echo "$C6_ARTIFACT_SHA256  work/c6.zip" | sha256sum -c -
          unzip -q work/c6.zip -d work/c6
          echo "$C6_SQLITE_SHA256  work/c6/contracts-11.6.3.sqlite" | sha256sum -c -
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -o work/c11.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C11_ARTIFACT_ID}/zip"
          echo "$C11_ARTIFACT_SHA256  work/c11.zip" | sha256sum -c -
          unzip -q work/c11.zip -d work/c11
          echo "$C11_JSON_SHA256  work/c11/unbound-base-contract-callers-11.6.3.json" | sha256sum -c -

      - name: Prepare exact final IL2CPP type and method metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors -o work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk
          ARM_APK=''; META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"; test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -
          curl --fail --location --retry 4 -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/dumper/config.json'); d=json.loads(p.read_text())
          d['RequireAnyKey']=False; d['GenerateScript']=True; d['GenerateDummyDll']=False
          p.write_text(json.dumps(d,indent=2))
          PY
          DLL=$(find work/dumper -type f -name Il2CppDumper.dll | head -1)
          test -n "$DLL"
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/script.json
          test -s work/dump/dump.cs

      - name: Analyze inherited base Parse contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-inherited-base-contracts.py \
            --dump-cs work/dump/dump.cs \
            --script-json work/dump/script.json \
            --c6-sqlite work/c6/contracts-11.6.3.sqlite \
            --c11 work/c11/unbound-base-contract-callers-11.6.3.json \
            --output reports/inherited-base-contracts-11.6.3.json \
            --markdown-output reports/inherited-base-contracts-11.6.3.md
          python - <<'PY'
          import json
          d=json.load(open('reports/inherited-base-contracts-11.6.3.json'))
          assert d['schema']==1
          assert d['c11_no_direct_xref_method_count']==4
          assert d['dump_type_count'] > 1000
          assert d['non_parse_residual_count'] >= 1
          # No hard coverage guess: the exact dump metadata decides whether inherited Parse is recoverable.
          assert d['inherited_relation_count'] >= 0
          print(json.dumps({k:d[k] for k in (
            'dump_type_count','c11_no_direct_xref_method_count','considered_base_task_count',
            'inherited_relation_count','inherited_endpoint_count','inherited_field_link_count',
            'base_task_relation_counts','override_rejection_count','non_parse_residual_count')},indent=2))
          PY

      - name: Enforce sanitized output boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name '*.sqlite' -o -name 'dump.cs' -o -name 'script.json' -o -name 'stringliteral.json' -o -name 'global-metadata.dat' \) | grep -q .; then
            echo 'raw/intermediate specimen escaped C12 boundary' >&2
            exit 1
          fi

      - name: Upload C12 inherited base contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-c12-inherited-base-contracts
          path: reports/
          if-no-files-found: error
          retention-days: 14
