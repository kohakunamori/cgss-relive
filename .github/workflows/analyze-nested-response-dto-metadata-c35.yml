name: Analyze C35 nested response DTO metadata

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/server-contracts-11.6.3
    paths:
      - scripts/analyze-nested-response-dto-metadata-c35.py
      - tests/test_nested_response_dto_metadata_c35.py
      - tools/DummyMetadataScanner/**
      - .github/workflows/analyze-nested-response-dto-metadata-c35.yml

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      C33_RUN_ID: '33866234775'
      C33_SHA256: '72ecb59e677affd2ffb5cf8bf04b7da5996ed2726d8351de75ba852aa6749176'
      XAPK_SHA256: '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d'
      LIB_SHA256: '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5'
      META_SHA256: '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Run C35 unit tests
        run: python -m unittest discover -s tests -p 'test_nested_response_dto_metadata_c35.py' -v

      - name: Download frozen C33 task DTO metadata
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.C33_RUN_ID }}
          name: final-client-c33-jsonutility-task-dto-metadata
          path: inputs/c33

      - name: Verify frozen C33
        shell: bash
        run: |
          set -euo pipefail
          C33=$(find inputs/c33 -type f -name 'c33-jsonutility-task-dto-metadata.json' -print -quit)
          test -n "$C33"
          echo "${C33_SHA256}  $C33" | sha256sum -c -
          echo "C33=$C33" >> "$GITHUB_ENV"

      - name: Prepare exact final dump and DummyDll metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/dumper work/dump reports
          curl --fail --location --retry 4 --retry-all-errors -o work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo "${XAPK_SHA256}  work/final.xapk" | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk
          ARM_APK=''; META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"; test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo "${LIB_SHA256}  work/libil2cpp.so" | sha256sum -c -
          echo "${META_SHA256}  work/global-metadata.dat" | sha256sum -c -
          curl --fail --location --retry 4 -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/dumper/config.json'); d=json.loads(p.read_text())
          d['RequireAnyKey']=False; d['GenerateScript']=True; d['GenerateDummyDll']=True
          p.write_text(json.dumps(d,indent=2))
          PY
          DLL=$(find work/dumper -type f -name Il2CppDumper.dll -print -quit)
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/dump.cs
          DUMMY=$(find work/dump -type f -name 'Assembly-CSharp.dll' -print -quit)
          test -n "$DUMMY"
          dotnet run --project tools/DummyMetadataScanner/DummyMetadataScanner.csproj -- \
            "$DUMMY" work/dummy-type-map.json
          test -s work/dummy-type-map.json

      - name: Recover exact nested DTO metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-nested-response-dto-metadata-c35.py \
            --dump-cs work/dump/dump.cs \
            --dummy-type-map work/dummy-type-map.json \
            --c33 "$C33" \
            --output reports/c35-nested-response-dto-metadata.json \
            | tee reports/c35-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/c35-nested-response-dto-metadata.json').read_text())
          assert d['schema']==2
          assert d['target_task_count']==4
          assert d['identity_proof']=='DummyDll-NestedClass+four-task-TypeDefIndex-calibration'
          assert d['c33_task_nested_ref_count'] >= 4
          assert d['unresolved_c33_task_nested_ref_count']==0
          assert d['untouched_client_acceptance'] is False
          assert d['ui_visible_success'] is False
          candidates={r['type']:r for r in d['response_candidates']}
          for name in (
            'Stage.ConcertMVFinishMVLoadingTask.ResponseDataMain',
            'Stage.ConcertMVStartTask.ResponseDataMain',
          ):
            assert name in candidates, name
            assert candidates[name]['field_count'] > 0, name
          print(json.dumps({
            'dummy_typedef_to_dump_index_delta':d['dummy_typedef_to_dump_index_delta'],
            'task_nested_type_counts':d['task_nested_type_counts'],
            'c33_task_nested_refs':d['c33_task_nested_refs'],
            'response_candidate_count':d['response_candidate_count'],
            'response_candidates':d['response_candidates'],
          },indent=2,sort_keys=True))
          PY

      - name: Enforce sanitized artifact boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work inputs
          mkdir -p reports
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name '*.dll' -o -name 'dump.cs' -o -name 'script.json' -o -name 'global-metadata.dat' \) | grep -q .; then
            echo 'raw specimen escaped C35 report boundary' >&2
            exit 1
          fi
          find reports -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS

      - name: Upload C35 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-c35-nested-response-dto-metadata-v2
          path: reports/
          if-no-files-found: error
          retention-days: 30
