name: Analyze C4 request field writes

on:
  workflow_dispatch:
  push:
    branches: [analysis/server-contracts-11.6.3]
    paths:
      - '.github/workflows/analyze-request-field-writes.yml'
      - 'scripts/analyze-request-field-writes.py'
      - 'scripts/extract-request-param-layouts.py'

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE_ARTIFACT_ID: '9920654705'
      INVENTORY_SHA256: 'c5c4106e4c4abacec4b6336433340f9e3dfa4a0d91820282c5a723f3c0abc543'
      ENDPOINTS_SHA256: '3173d45f54265bc491a166405713802bb8eccd52240446ab96856747a3ae6627'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Fetch validated sanitized C0 inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline work/xapk work/dumper work/dump reports
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -o baseline.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip"
          unzip -q baseline.zip -d baseline
          echo "${INVENTORY_SHA256}  baseline/server-contract-inventory.json" | sha256sum -c -
          echo "${ENDPOINTS_SHA256}  baseline/endpoint-contracts.json" | sha256sum -c -

      - name: Prepare exact final native and managed layouts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors -o work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk
          ARM_APK=''; META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"; test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -
          curl --fail --location --retry 4 -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/dumper/config.json'); d=json.loads(p.read_text())
          d['RequireAnyKey']=False; d['GenerateScript']=True; d['GenerateDummyDll']=False
          p.write_text(json.dumps(d,indent=2))
          PY
          DLL=$(find work/dumper -type f -name Il2CppDumper.dll | head -1)
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/dump.cs; test -s work/dump/script.json
          python -m pip install --disable-pip-version-check capstone pyelftools

      - name: Rebuild sanitized C2 layouts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract-request-param-layouts.py \
            --dump-cs work/dump/dump.cs \
            --inventory baseline/server-contract-inventory.json \
            --output reports/request-param-layouts.json \
            --markdown-output reports/request-param-layouts.md
          python - <<'PY'
          import json
          d=json.load(open('reports/request-param-layouts.json'))
          assert d['schema']==1
          assert d['parsed_type_count'] > 25000
          known_nonparam_objects = {
            'Stage_WorkBusData_SlotDataV2',
            'Stage_WorkCapabilityData_CapabilityEditData',
            'Stage_WorkDressData_DressData',
            'Stage_WorkMeetupUserData_MeetupUnitInfo',
            'Stage_WorkUnitData_UnitData',
          }
          assert set(d['unmatched_request_signature_object_c_types']) <= known_nonparam_objects, d['unmatched_request_signature_object_c_types']
          assert 300 < d['baseparam_postparams_lineage_type_count'] < 1000, d['baseparam_postparams_lineage_type_count']
          assert d['selected_param_type_with_fields_count'] > 200, d['selected_param_type_with_fields_count']
          print(json.dumps({k:d[k] for k in ('parsed_type_count','request_signature_object_c_type_count','unmatched_request_signature_object_c_types','baseparam_postparams_lineage_type_count','selected_param_type_count','selected_param_type_with_fields_count','unique_field_name_candidate_count')},indent=2))
          PY

      - name: Analyze request payload field writes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-request-field-writes.py \
            --lib work/libil2cpp.so \
            --script-json work/dump/script.json \
            --inventory baseline/server-contract-inventory.json \
            --layouts reports/request-param-layouts.json \
            --endpoint-contracts baseline/endpoint-contracts.json \
            --output reports/request-wire-contracts-11.6.3.json \
            --markdown-output reports/request-wire-contracts-11.6.3.md
          python - <<'PY'
          import json
          d=json.load(open('reports/request-wire-contracts-11.6.3.json'))
          assert d['schema']==1
          assert d['request_method_count']==402, d['request_method_count']
          assert d['method_with_param_assignment_count'] > 100, d['method_with_param_assignment_count']
          assert d['method_with_payload_count'] >= d['method_with_param_assignment_count']
          assert d['payload_count'] >= d['method_with_payload_count']
          assert d['field_write_contract_count'] > 50, d['field_write_contract_count']
          print(json.dumps({k:d[k] for k in ('request_method_count','method_with_param_assignment_count','method_with_payload_count','payload_count','payload_resolution_counts','field_write_contract_count','resolved_unique_field_count')},indent=2))
          PY

      - name: Enforce sanitized boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work baseline baseline.zip
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'dump.cs' -o -name 'script.json' -o -name 'stringliteral.json' -o -name 'global-metadata.dat' \) | grep -q .; then
            echo 'raw specimen escaped C4 report boundary' >&2
            exit 1
          fi

      - name: Upload request wire contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-c4-request-wire-contracts
          path: reports/
          if-no-files-found: error
          retention-days: 7
