name: Analyze residual final-client contract xrefs

on:
  workflow_dispatch:
  push:
    branches: [analysis/server-contracts-11.6.3]
    paths:
      - '.github/workflows/analyze-residual-contract-xrefs.yml'
      - 'scripts/analyze-residual-route-literal-xrefs.py'
      - 'scripts/analyze-common-route-literal-xrefs.py'
      - 'scripts/materialize-api-map.py'
      - 'scripts/validate-api-map.py'
      - 'contracts/api-map-11.6.3.json.gz.b64'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Prepare exact final specimen and endpoint map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/dumper work/dump reports
          python scripts/materialize-api-map.py contracts/api-map-11.6.3.json.gz.b64 work/api-map.json
          curl --fail --location --retry 4 --retry-all-errors -o work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk
          ARM_APK=''; META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"; test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -
          curl --fail --location --retry 4 -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/dumper/config.json'); d=json.loads(p.read_text())
          d['RequireAnyKey']=False; d['GenerateScript']=True; d['GenerateDummyDll']=False
          p.write_text(json.dumps(d,indent=2))
          PY
          DLL=$(find work/dumper -type f -name Il2CppDumper.dll | head -1)
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/script.json; test -s work/dump/stringliteral.json
          python -m pip install --disable-pip-version-check capstone pyelftools

      - name: Trace remaining A-group route literals
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-residual-route-literal-xrefs.py \
            --lib work/libil2cpp.so \
            --script-json work/dump/script.json \
            --stringliteral-json work/dump/stringliteral.json \
            --api-map work/api-map.json \
            --keys '72,80,95,103,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154,155,156,157,158,159,277,293,294,328,397,444' \
            --output reports/residual-a-route-xrefs.json
          python - <<'PY'
          import json
          d=json.load(open('reports/residual-a-route-xrefs.json'))
          assert d['schema']==1 and d['route_count']==30
          nonzero={k:v for k,v in d['by_key'].items() if v}
          print(json.dumps({
            'route_count':d['route_count'],
            'exact_reference_count':d['exact_reference_count'],
            'keys_with_consumers':len(nonzero),
            'by_key':nonzero,
            'unmapped':d['unmapped_references'],
          },indent=2))
          PY

      - name: Trace all B-group route literals
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-common-route-literal-xrefs.py \
            --lib work/libil2cpp.so \
            --script-json work/dump/script.json \
            --stringliteral-json work/dump/stringliteral.json \
            --api-map work/api-map.json \
            --output reports/common-route-literal-xrefs.json
          python - <<'PY'
          import json
          d=json.load(open('reports/common-route-literal-xrefs.json'))
          assert d['schema']==1 and d['route_count']==22
          outside=[]
          for key,refs in d['by_key'].items():
            for ref in refs:
              if ref['consumer']!='Common.ApiType$$.cctor':
                outside.append({'key':int(key),**ref})
          print(json.dumps({
            'route_count':d['route_count'],
            'exact_reference_count':d['exact_reference_count'],
            'outside_common_cctor_count':len(outside),
            'outside_common_cctor':outside,
            'by_key':d['by_key'],
            'unmapped':d['unmapped_references'],
          },indent=2))
          PY

      - name: Enforce sanitized boundary
        if: always()
        shell: bash
        run: |
          rm -rf work
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'script.json' -o -name 'stringliteral.json' -o -name 'global-metadata.dat' \) | grep -q .; then
            echo 'raw specimen escaped residual report boundary' >&2
            exit 1
          fi

      - name: Upload residual xref reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-final-client-contract-xrefs
          path: reports/
          if-no-files-found: error
          retention-days: 7
