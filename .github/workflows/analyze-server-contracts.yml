name: Analyze final 11.6.3 server contracts

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/server-contracts-11.6.3
    paths:
      - '.github/workflows/analyze-server-contracts.yml'
      - 'scripts/analyze-server-contracts.py'
      - 'scripts/analyze-api-type-enums.py'
      - 'scripts/analyze-task-api-keys.py'
      - 'scripts/analyze-networktask-api-field.py'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 6 for Il2CppDumper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download and verify exact final XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk reports
          curl --fail --location --retry 4 --retry-all-errors \
            --output work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk

      - name: Extract and verify exact IL2CPP inputs
        shell: bash
        run: |
          set -euo pipefail
          ARM_APK=''
          META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"
          test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -

      - name: Run Il2CppDumper v6.7.46
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          mkdir -p work/dumper work/dump
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('work/dumper/config.json')
          d = json.loads(p.read_text())
          d['RequireAnyKey'] = False
          d['GenerateScript'] = True
          d['GenerateDummyDll'] = False
          p.write_text(json.dumps(d, indent=2))
          PY
          DLL=$(find work/dumper -maxdepth 2 -type f -name 'Il2CppDumper.dll' | head -1)
          test -n "$DLL"
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/dump.cs
          test -s work/dump/script.json
          test -s work/dump/stringliteral.json

      - name: Discover exact ApiType enum surfaces
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-api-type-enums.py \
            --dump-cs work/dump/dump.cs \
            --script-json work/dump/script.json \
            --stringliteral-json work/dump/stringliteral.json \
            --output reports/api-type-enums.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('reports/api-type-enums.json').read_text())
          assert d['schema'] == 2
          assert len(d['a_candidates']) == 1
          assert d['a_cctor']['rva'] == 0x4271C3C
          assert d['b_cctor']['rva'] == 0x4DC8490
          print(json.dumps({
              'a_enum': d['a_candidates'][0]['full_name'],
              'a_entries': d['a_candidates'][0]['entry_count'],
              'a_cctor': hex(d['a_cctor']['rva']),
              'b_cctor': hex(d['b_cctor']['rva']),
              'b_exact_enum_candidates': len(d['b_exact_candidates']),
              'b_superset_enum_candidates': len(d['b_superset_candidates']),
              'related_method_count': len(d['related_methods']),
              'api_shaped_literal_count': d['api_shaped_literal_count'],
          }, indent=2))
          PY

      - name: Build sanitized server-facing inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check capstone pyelftools
          python scripts/analyze-server-contracts.py \
            --lib work/libil2cpp.so \
            --dump-cs work/dump/dump.cs \
            --script-json work/dump/script.json \
            --stringliteral-json work/dump/stringliteral.json \
            --output reports/server-contract-inventory.json \
            --markdown-output reports/server-contract-inventory.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/server-contract-inventory.json')
          d = json.loads(p.read_text())
          assert d['schema'] == 1
          assert d['network_task_type_count'] > 0
          assert d['network_task_method_count'] > 0
          assert d['response_role_method_count'] > 0
          print(json.dumps({
              'network_task_type_count': d['network_task_type_count'],
              'network_task_method_count': d['network_task_method_count'],
              'request_role_method_count': d['request_role_method_count'],
              'response_role_method_count': d['response_role_method_count'],
              'tasks_with_contract_literals': d['tasks_with_contract_literals'],
          }, indent=2))
          PY

      - name: Prove NetworkTask API-key field semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-networktask-api-field.py \
            --lib work/libil2cpp.so \
            --dump-cs work/dump/dump.cs \
            --script-json work/dump/script.json \
            --inventory reports/server-contract-inventory.json \
            --api-type-enums reports/api-type-enums.json \
            --output reports/networktask-api-field.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('reports/networktask-api-field.json').read_text())
          assert d['schema'] == 1
          assert len(d['network_task']['field_at_offset']) == 1
          print(json.dumps({
              'field_at_0x50': d['network_task']['field_at_offset'][0],
              'typed_api_field': d['network_task']['typed_api_field'],
              'networktask_access_methods': [m['member'] for m in d['network_task']['field_access_methods']],
              'anchor_count': d['anchor_count'],
              'anchored_with_constant_write': d['anchored_with_constant_write'],
              'anchored_expected_value_seen': d['anchored_expected_value_seen'],
              'anchored_expected_value_missing': d['anchored_expected_value_missing'],
              'anchored_mismatches': d['anchored_mismatches'],
          }, indent=2))
          PY

      - name: Infer constructor ApiType key flow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-task-api-keys.py \
            --lib work/libil2cpp.so \
            --script-json work/dump/script.json \
            --inventory reports/server-contract-inventory.json \
            --api-type-enums reports/api-type-enums.json \
            --output reports/task-api-key-analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('reports/task-api-key-analysis.json').read_text())
          assert d['schema'] == 1
          assert d['task_count'] > 0
          print(json.dumps({
              'anchor_count': d['anchor_count'],
              'strong_feature_count': len(d['strong_features']),
              'proven_static_pattern_count': d['proven_static_pattern_count'],
              'conflict_count': d['conflict_count'],
              'unresolved_count': d['unresolved_count'],
              'strong_features': d['strong_features'][:8],
          }, indent=2))
          PY

      - name: Enforce clean-room artifact boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          find reports -maxdepth 1 -type f -print
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'global-metadata.dat' -o -name 'dump.cs' -o -name 'script.json' -o -name 'stringliteral.json' \) | grep -q .; then
            echo 'proprietary/bulk reverse-engineering output escaped report boundary' >&2
            exit 1
          fi

      - name: Upload sanitized contract inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-server-contract-inventory
          path: reports/
          if-no-files-found: error
          retention-days: 7
