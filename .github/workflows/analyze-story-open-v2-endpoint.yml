name: Analyze StoryOpenV2 endpoint semantics

on:
  workflow_dispatch:
  push:
    branches: [analysis/server-contracts-11.6.3]
    paths:
      - '.github/workflows/analyze-story-open-v2-endpoint.yml'
      - 'scripts/analyze-story-open-v2-semantics.py'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 6 for Il2CppDumper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download and verify exact final XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk reports
          curl --fail --location --retry 4 --retry-all-errors \
            --output work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk

      - name: Extract and verify exact IL2CPP specimen
        shell: bash
        run: |
          set -euo pipefail
          ARM_APK=''; META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"; test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -

      - name: Build exact Il2CppDumper metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          mkdir -p work/dumper work/dump
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/dumper/config.json')
          d=json.loads(p.read_text())
          d['RequireAnyKey']=False
          d['GenerateScript']=True
          d['GenerateDummyDll']=False
          p.write_text(json.dumps(d, indent=2))
          PY
          DLL=$(find work/dumper -maxdepth 2 -type f -name 'Il2CppDumper.dll' | head -1)
          test -n "$DLL"
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/dump.cs
          test -s work/dump/script.json
          test -s work/dump/stringliteral.json

      - name: Install native analysis dependencies
        run: python -m pip install --disable-pip-version-check capstone pyelftools

      - name: Trace exact story/open_v2 semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze-story-open-v2-semantics.py \
            --lib work/libil2cpp.so \
            --dump-cs work/dump/dump.cs \
            --script-json work/dump/script.json \
            --stringliteral-json work/dump/stringliteral.json \
            --output reports/story-open-v2-semantics-11.6.3.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/story-open-v2-semantics-11.6.3.json').read_text())
          assert d['schema'] == 1
          assert d['endpoint'] == {'group':'A','key':48,'enum':'StoryReleaseEventStory'}
          setp=next(row for row in d['methods'] if row['name'].endswith('StoryReleaseEventStoryTask$$SetParameter'))
          parse=next(row for row in d['methods'] if row['name'].endswith('StoryReleaseEventStoryTask$$Parse'))
          assert setp['tiny_full_instruction_listing'], setp
          outline='\n'.join(line for row in d['type_outlines'] for line in row['outline'])
          for field in ('story_exchange_data_id', 'item_id', 'own_num'):
              assert field in outline, field
          targets=[name for row in parse['named_direct_calls'] for name in row['targets']]
          assert any(name.endswith('WorkStoryData$$OpenStory') for name in targets), targets
          assert any(name.endswith('WorkStoryData$$AddItemOpenPrologueEventId') for name in targets), targets
          literals={value for row in parse['referenced_string_literals'] for value in row['values']}
          assert 'data' in literals, sorted(literals)
          print(json.dumps({
              'set_parameter': setp,
              'parse_selected_calls': parse['selected_direct_calls'],
              'parse_literals': parse['referenced_string_literals'],
              'type_outlines': d['type_outlines'],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Enforce sanitized report boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'dump.cs' -o -name 'script.json' -o -name 'stringliteral.json' -o -name 'global-metadata.dat' \) | grep -q .; then
            echo 'raw specimen escaped story/open_v2 analysis boundary' >&2
            exit 1
          fi
          if find reports -maxdepth 1 -type f ! -name SHA256SUMS | grep -q .; then
            find reports -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS
          else
            : > reports/SHA256SUMS
          fi

      - name: Upload sanitized story/open_v2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-story-open-v2-endpoint
          path: reports/
          if-no-files-found: error
          retention-days: 30
