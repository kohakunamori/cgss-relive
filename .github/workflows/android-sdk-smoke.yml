name: Android reverse-build smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-sdk-smoke.yml'

permissions:
  contents: read

jobs:
  android-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve sdkmanager and install pinned build-tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK root is not available" >&2
            exit 1
          fi

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 -print 2>/dev/null | sort -V | tail -1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'

          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Verify Android tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          aapt version
          aapt2 version
          command -v zipalign
          apksigner version

      - name: Download and verify exact final specimen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk
          curl --fail --location --retry 4 --retry-all-errors \
            --output work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk

          BASE_APK=''
          ARM_APK=''
          META_APK=''
          APK_COUNT=0
          while IFS= read -r -d '' apk; do
            APK_COUNT=$((APK_COUNT + 1))
            first_line="$(aapt dump badging "$apk" | head -1)"
            entries="$(unzip -Z1 "$apk")"

            if [[ "$first_line" == *"package: name='jp.co.bandainamcoent.BNEI0242'"* ]] && [[ "$first_line" != *" split='"* ]]; then
              BASE_APK="$apk"
            fi
            if grep -qx 'lib/arm64-v8a/libil2cpp.so' <<<"$entries"; then
              ARM_APK="$apk"
            fi
            if grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat' <<<"$entries"; then
              META_APK="$apk"
            fi
          done < <(find work/xapk -type f -name '*.apk' -print0)

          test "$APK_COUNT" -gt 1
          test -n "$BASE_APK"
          test -n "$ARM_APK"
          test -n "$META_APK"

          ARM_HASH="$(unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so | sha256sum | awk '{print $1}')"
          META_HASH="$(unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat | sha256sum | awk '{print $1}')"
          test "$ARM_HASH" = '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5'
          test "$META_HASH" = '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586'

          echo "BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "ARM_APK=$ARM_APK" >> "$GITHUB_ENV"
          echo "META_APK=$META_APK" >> "$GITHUB_ENV"
          echo "SOURCE_APK_COUNT=$APK_COUNT" >> "$GITHUB_ENV"
          aapt dump badging "$BASE_APK" | head -1
          echo "source_apk_count=$APK_COUNT"
          echo "frozen arm64 IL2CPP and metadata hashes verified"

      - name: Rebuild base APK with Apktool 2.12.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output work/apktool.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar'
          test "$(java -jar work/apktool.jar --version)" = '2.12.1'
          java -jar work/apktool.jar d -f "$BASE_APK" -o work/decompiled
          java -jar work/apktool.jar b work/decompiled -o work/rebuilt-unsigned.apk
          test -s work/rebuilt-unsigned.apk

      - name: Sign complete split install set and verify payload integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/aligned work/install-set

          keytool -genkeypair \
            -keystore work/ci-signing.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci \
            -dname 'CN=CGSS Relive CI' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt

          sign_apk() {
            local input="$1"
            local output="$2"
            local aligned="$3"
            zipalign -f 4 "$input" "$aligned"
            apksigner sign \
              --ks work/ci-signing.jks \
              --ks-pass pass:changeit \
              --key-pass pass:changeit \
              --out "$output" \
              "$aligned"
            apksigner verify --verbose "$output"
          }

          sign_apk \
            work/rebuilt-unsigned.apk \
            work/install-set/base.apk \
            work/aligned/base.apk

          while IFS= read -r -d '' apk; do
            if [[ "$apk" == "$BASE_APK" ]]; then
              continue
            fi
            name="$(basename "$apk")"
            sign_apk \
              "$apk" \
              "work/install-set/$name" \
              "work/aligned/$name"
          done < <(find work/xapk -type f -name '*.apk' -print0)

          SIGNED_APK_COUNT="$(find work/install-set -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$SIGNED_APK_COUNT" -eq "$SOURCE_APK_COUNT"

          BASE_BADGING="$(aapt dump badging work/install-set/base.apk | head -1)"
          echo "$BASE_BADGING"
          [[ "$BASE_BADGING" == *"package: name='jp.co.bandainamcoent.BNEI0242'"* ]]
          [[ "$BASE_BADGING" == *"versionCode='438'"* ]]
          [[ "$BASE_BADGING" == *"versionName='11.6.3'"* ]]
          [[ "$BASE_BADGING" != *" split='"* ]]

          while IFS= read -r -d '' signed; do
            badging="$(aapt dump badging "$signed" | head -1)"
            [[ "$badging" == *"package: name='jp.co.bandainamcoent.BNEI0242'"* ]]
            [[ "$badging" == *"versionCode='438'"* ]]
            if [[ "$signed" == 'work/install-set/base.apk' ]]; then
              [[ "$badging" == *"versionName='11.6.3'"* ]]
              [[ "$badging" != *" split='"* ]]
            else
              [[ "$badging" == *" split='"* ]]
            fi
          done < <(find work/install-set -maxdepth 1 -type f -name '*.apk' -print0)

          signed_for_source() {
            local source="$1"
            if [[ "$source" == "$BASE_APK" ]]; then
              printf '%s\n' 'work/install-set/base.apk'
            else
              printf 'work/install-set/%s\n' "$(basename "$source")"
            fi
          }

          SIGNED_ARM_APK="$(signed_for_source "$ARM_APK")"
          SIGNED_META_APK="$(signed_for_source "$META_APK")"
          test -s "$SIGNED_ARM_APK"
          test -s "$SIGNED_META_APK"

          ARM_HASH_AFTER="$(unzip -p "$SIGNED_ARM_APK" lib/arm64-v8a/libil2cpp.so | sha256sum | awk '{print $1}')"
          META_HASH_AFTER="$(unzip -p "$SIGNED_META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat | sha256sum | awk '{print $1}')"
          test "$ARM_HASH_AFTER" = '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5'
          test "$META_HASH_AFTER" = '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586'

          CERT_DIGEST=''
          while IFS= read -r -d '' signed; do
            digest="$(apksigner verify --print-certs "$signed" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
            test -n "$digest"
            if [[ -z "$CERT_DIGEST" ]]; then
              CERT_DIGEST="$digest"
            else
              test "$digest" = "$CERT_DIGEST"
            fi
          done < <(find work/install-set -maxdepth 1 -type f -name '*.apk' -print0)

          echo "signed_apk_count=$SIGNED_APK_COUNT"
          echo "all split APKs share one CI signer"
          echo "frozen arm64 IL2CPP and metadata hashes preserved after rebuild/signing"

      - name: Enforce no proprietary artifact escape
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          test ! -e work/final.xapk
          test ! -d work/install-set
