name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile Python helpers
        run: >-
          python -m py_compile
          scripts/inspect-apk.py
          scripts/fetch-resource-bootstrap.py
          scripts/extract-analysis-targets.py
          scripts/scan-analysis-targets.py
          scripts/unpack-xapk.py
          scripts/inspect-il2cpp-metadata.py
          server/cgss_codec.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
