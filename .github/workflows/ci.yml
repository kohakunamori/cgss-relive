name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install --disable-pip-version-check capstone pyelftools
      - name: Compile Python helpers
        run: python -m compileall -q scripts server tests
      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
      - name: Run tests
        run: python -m unittest discover -s tests -v
