name: Compile C15 runtime response templates

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/server-contracts-11.6.3
    paths:
      - server/conservative_templates.py
      - server/response_templates.py
      - scripts/prepare-runtime-response-templates.py
      - tests/test_conservative_runtime_templates.py
      - .github/workflows/compile-c15-runtime-templates.yml

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Download fixed C14 runtime contract catalog
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33847577801
          name: final-client-c14-effective-runtime-contract-catalog
          path: artifacts/c14

      - name: Download fixed C9 semantic DB
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33838319342
          name: final-client-c9-client-semantic-db-tail-aware
          path: artifacts/c9

      - name: Locate and verify frozen evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          C14=$(find artifacts/c14 -type f -name '*effective-runtime-contract-catalog.json' -print -quit)
          C9=$(find artifacts/c9 -type f -name '*.sqlite' -print -quit)
          test -n "$C14"
          test -n "$C9"
          echo "de42e8340458c96a66dcf798bd47965638efcb082c5bbb1b37c149520a7e18b8  $C14" | sha256sum -c -
          echo "a85922db2c106de3412cac511c8183ea34559eed8f844ef5186467f76dcdd8fd  $C9" | sha256sum -c -
          echo "C14=$C14" >> "$GITHUB_ENV"
          echo "C9=$C9" >> "$GITHUB_ENV"

      - name: Run conservative runtime unit and wire tests
        run: python -m unittest discover -s tests -p 'test_conservative_runtime_templates.py' -v

      - name: Compile real C15 runtime template baseline
        run: |
          python scripts/prepare-runtime-response-templates.py \
            --semantic-db "$C9" \
            --effective-runtime-catalog "$C14" \
            --output out/c15-runtime-response-templates.json \
            | tee out/c15-runtime-compile-summary.json

      - name: Validate compiled baseline through real C9 loader
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from server.response_templates import ResponseTemplateStore
          from server.semantic_contracts import SemanticContractIndex

          semantic = SemanticContractIndex(Path(os.environ['C9']))
          store = ResponseTemplateStore.load(
              Path('out/c15-runtime-response-templates.json'),
              semantic_index=semantic,
          )
          if store.count != 154:
              raise SystemExit(f'expected 154 compiled C15 routes, got {store.count}')
          for route in ('/account_notice/accept', '/birthday/save', '/card_storage/setting'):
              template = store.get(route)
              if template is None or dict(template.data) != {}:
                  raise SystemExit(f'missing expected conservative route: {route}')
          summary = json.loads(Path('out/c15-runtime-compile-summary.json').read_text())
          if summary['device_acceptance'] is not False:
              raise SystemExit('static C15 compile must never claim device acceptance')
          print({'validated_template_routes': store.count})
          PY

      - name: Hash outputs
        run: sha256sum out/* | tee out/SHA256SUMS

      - name: Upload compiled runtime baseline
        uses: actions/upload-artifact@v4
        with:
          name: final-client-c15-runtime-response-templates
          path: out/
          if-no-files-found: error
          retention-days: 30
