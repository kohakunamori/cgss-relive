name: Compile static runtime response templates

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/server-contracts-11.6.3
    paths:
      - server/conservative_templates.py
      - server/optional_omission_templates.py
      - server/response_templates.py
      - server/template_response.py
      - scripts/prepare-runtime-response-templates.py
      - scripts/run-rooted-full-service-stack.py
      - tests/test_conservative_runtime_templates.py
      - tests/test_optional_omission_templates.py
      - tests/test_full_service_stack_wrapper.py
      - tests/test_template_response.py
      - .github/workflows/compile-c15-runtime-templates.yml

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Download fixed C14 runtime contract catalog
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33847577801
          name: final-client-c14-effective-runtime-contract-catalog
          path: artifacts/c14

      - name: Download fixed C9 semantic DB
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33838319342
          name: final-client-c9-client-semantic-db-tail-aware
          path: artifacts/c9

      - name: Locate and verify frozen evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          C14=$(find artifacts/c14 -type f -name '*effective-runtime-contract-catalog.json' -print -quit)
          C9=$(find artifacts/c9 -type f -name '*.sqlite' -print -quit)
          test -n "$C14"
          test -n "$C9"
          echo "de42e8340458c96a66dcf798bd47965638efcb082c5bbb1b37c149520a7e18b8  $C14" | sha256sum -c -
          echo "a85922db2c106de3412cac511c8183ea34559eed8f844ef5186467f76dcdd8fd  $C9" | sha256sum -c -
          echo "C14=$C14" >> "$GITHUB_ENV"
          echo "C9=$C9" >> "$GITHUB_ENV"

      - name: Run static runtime template tests
        run: |
          python -m unittest discover -s tests -p 'test_conservative_runtime_templates.py' -v
          python -m unittest discover -s tests -p 'test_optional_omission_templates.py' -v
          python -m unittest discover -s tests -p 'test_template_response.py' -v
          python -m unittest discover -s tests -p 'test_full_service_stack_wrapper.py' -v

      - name: Compile real static runtime template baseline
        run: |
          mkdir -p out
          python scripts/prepare-runtime-response-templates.py \
            --semantic-db "$C9" \
            --effective-runtime-catalog "$C14" \
            --output out/static-runtime-response-templates.json \
            | tee out/static-runtime-compile-summary.json

      - name: Validate composed baseline through real C9 loader
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from server.response_templates import ResponseTemplateStore
          from server.semantic_contracts import SemanticContractIndex

          semantic = SemanticContractIndex(Path(os.environ['C9']))
          store = ResponseTemplateStore.load(
              Path('out/static-runtime-response-templates.json'),
              semantic_index=semantic,
          )
          if store.count != 155:
              raise SystemExit(f'expected 155 compiled static routes, got {store.count}')
          for route in ('/account_notice/accept', '/birthday/save', '/card_storage/setting'):
              template = store.get(route)
              if template is None or template.data != {}:
                  raise SystemExit(f'missing expected C15 conservative route: {route}')
          optional = store.get('/producer_rank/index')
          if optional is None or optional.endpoint_id != 162 or optional.data != {}:
              raise SystemExit('missing C18 /producer_rank/index optional-omission template')
          if 'parser-proven omission' not in (optional.evidence or ''):
              raise SystemExit('C18 provenance was not retained')
          summary = json.loads(Path('out/static-runtime-compile-summary.json').read_text())
          expected = {
              'c15_baseline_routes': 154,
              'c18_optional_omission_routes': 1,
              'static_baseline_routes': 155,
              'compiled_template_routes': 155,
              'device_acceptance': False,
          }
          for key, value in expected.items():
              if summary.get(key) != value:
                  raise SystemExit(f'summary mismatch for {key}: {summary.get(key)!r} != {value!r}')
          print({'validated_template_routes': store.count})
          PY

      - name: Hash outputs
        run: sha256sum out/* | tee out/SHA256SUMS

      - name: Upload compiled static runtime baseline
        uses: actions/upload-artifact@v4
        with:
          name: final-client-static-runtime-response-templates-c15-c18
          path: out/
          if-no-files-found: error
          retention-days: 30
