name: Localization client text metadata

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/localization-client-text-metadata.yml'
      - 'localization/tools/analyze_text_rendering_metadata.py'
      - 'tests/test_localization_analyze_text_rendering_metadata.py'

permissions:
  contents: read

jobs:
  text-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install .NET 6 for Il2CppDumper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Run targeted parser unit test
        run: |
          python -m unittest tests/test_localization_analyze_text_rendering_metadata.py

      - name: Download and verify exact final XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/dump reports
          curl --fail --location --retry 4 --retry-all-errors \
            --output work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk

      - name: Extract and verify exact arm64 IL2CPP inputs
        shell: bash
        run: |
          set -euo pipefail
          ARM_APK=''
          META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"
          test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -

      - name: Run Il2CppDumper v6.7.46
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          mkdir -p work/dumper
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('work/dumper/config.json')
          data = json.loads(p.read_text())
          data['RequireAnyKey'] = False
          data['GenerateScript'] = True
          data['GenerateDummyDll'] = False
          p.write_text(json.dumps(data, indent=2))
          PY
          DLL=$(find work/dumper -maxdepth 2 -type f -name 'Il2CppDumper.dll' | head -1)
          test -n "$DLL"
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/dump.cs

      - name: Extract sanitized localization text/font interfaces
        run: |
          python localization/tools/analyze_text_rendering_metadata.py \
            work/dump/dump.cs \
            --output reports/localization-text-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/localization-text-metadata.json').read_text())
          assert report['schema_version'] == 1
          targets = report['targets']
          assert set(targets) == {
              'UnityEngine.UI.Text',
              'UnityEngine.Font',
              'TMPro.TMP_Text',
              'TMPro.TextMeshProUGUI',
              'TMPro.TextMeshPro',
              'TMPro.TMP_FontAsset',
              'TMPro.TMP_Settings',
          }
          assert targets['UnityEngine.UI.Text']['present'] or targets['TMPro.TMP_Text']['present']
          for target in targets.values():
              for method in target['interesting_methods']:
                  assert set(method) == {'name', 'rva'}
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Enforce proprietary artifact boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          test ! -e work/final.xapk
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'global-metadata.dat' -o -name 'dump.cs' -o -name 'script.json' -o -name 'stringliteral.json' \) | grep -q .; then
            echo 'proprietary/bulk analysis output escaped report boundary' >&2
            exit 1
          fi
          find reports -maxdepth 1 -type f -print

      - name: Upload sanitized text metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-client-text-metadata
          path: reports/localization-text-metadata.json
          if-no-files-found: warn
          retention-days: 7
