name: Refine C5 response requiredness tails

on:
  workflow_dispatch:
  push:
    branches: [analysis/server-contracts-11.6.3]
    paths:
      - '.github/workflows/refine-response-requiredness-tail-aware.yml'
      - 'scripts/classify-response-requiredness-tail-aware.py'

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE_ARTIFACT_ID: '9920654705'
      C3_ARTIFACT_ID: '9922355314'
      INVENTORY_SHA256: 'c5c4106e4c4abacec4b6336433340f9e3dfa4a0d91820282c5a723f3c0abc543'
      ENDPOINTS_SHA256: '3173d45f54265bc491a166405713802bb8eccd52240446ab96856747a3ae6627'
      C3_SHA256: 'd09d15466233d9429a33eb2f6ce8b7a19646c6afc12ab8983d43d427bd178b95'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Fetch validated sanitized C0 and C3 inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline c3 work/xapk work/dumper work/dump reports
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -o baseline.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip"
          unzip -q baseline.zip -d baseline
          echo "${INVENTORY_SHA256}  baseline/server-contract-inventory.json" | sha256sum -c -
          echo "${ENDPOINTS_SHA256}  baseline/endpoint-contracts.json" | sha256sum -c -
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -o c3.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C3_ARTIFACT_ID}/zip"
          unzip -q c3.zip -d c3
          echo "${C3_SHA256}  c3/response-field-accesses.json" | sha256sum -c -

      - name: Prepare exact final native method map
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors -o work/final.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.bandainamcoent.BNEI0242?version=latest'
          echo '609868c5a4cf5ce78ed653be448717e426410b4df03ca9e0356a046afc0d465d  work/final.xapk' | sha256sum -c -
          unzip -q work/final.xapk -d work/xapk
          ARM_APK=''; META_APK=''
          while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then ARM_APK="$apk"; fi
            if unzip -Z1 "$apk" | grep -qx 'assets/bin/Data/Managed/Metadata/global-metadata.dat'; then META_APK="$apk"; fi
          done < <(find work/xapk -type f -name '*.apk' -print0)
          test -n "$ARM_APK"; test -n "$META_APK"
          unzip -p "$ARM_APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          unzip -p "$META_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          echo '2d950f3bab72c73adef62a3e312c64e4e42ae0287cb2454cdec008eb9ed699c5  work/libil2cpp.so' | sha256sum -c -
          echo '2d31901dd94b4b774c1fda7c3a5f409dc8a1cae16078314bd42f832b33c69586  work/global-metadata.dat' | sha256sum -c -
          curl --fail --location --retry 4 -o work/il2cppdumper.zip \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          unzip -q work/il2cppdumper.zip -d work/dumper
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/dumper/config.json'); d=json.loads(p.read_text())
          d['RequireAnyKey']=False; d['GenerateScript']=True; d['GenerateDummyDll']=False
          p.write_text(json.dumps(d,indent=2))
          PY
          DLL=$(find work/dumper -type f -name Il2CppDumper.dll | head -1)
          test -n "$DLL"
          dotnet "$DLL" "$(pwd)/work/libil2cpp.so" "$(pwd)/work/global-metadata.dat" "$(pwd)/work/dump"
          test -s work/dump/script.json
          python -m pip install --disable-pip-version-check capstone pyelftools

      - name: Classify requiredness with validated managed tail exits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/classify-response-requiredness-tail-aware.py \
            --lib work/libil2cpp.so \
            --script-json work/dump/script.json \
            --c3 c3/response-field-accesses.json \
            --endpoint-contracts baseline/endpoint-contracts.json \
            --output reports/response-wire-contracts-11.6.3.json \
            --markdown-output reports/response-wire-contracts-11.6.3.md
          python - <<'PY'
          import json
          d=json.load(open('reports/response-wire-contracts-11.6.3.json'))
          assert d['schema']==1
          assert d['refinement']=='managed-direct-tail-exit-v1'
          assert d['source_c3_access_count']==2406
          assert d['access_count']==2406
          assert d['method_count']==365
          assert d['cfg_complete_method_count'] >= 339
          assert d['cfg_incomplete_method_count'] <= 26
          assert d['cfg_method_with_validated_managed_tail_exit_count'] > 0
          assert d['cfg_validated_managed_tail_edge_count'] > 0
          assert d['requiredness_counts'].get('unknown-cfg',0) < 454
          assert sum(d['requiredness_counts'].values()) == 2406
          assert d['contract_count']==1936
          # We must never make the indirect-dispatch family look complete.
          assert d['cfg_incomplete_reason_counts'].get('indirect-branch',0) >= 15
          print(json.dumps({k:d[k] for k in (
            'method_count','cfg_complete_method_count','cfg_incomplete_method_count',
            'cfg_method_with_validated_managed_tail_exit_count','cfg_validated_managed_tail_edge_count',
            'cfg_incomplete_reason_counts','requiredness_counts','contract_requiredness_counts','contract_count')},indent=2))
          PY

      - name: Enforce sanitized boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work baseline c3 baseline.zip c3.zip
          if find reports -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'dump.cs' -o -name 'script.json' -o -name 'stringliteral.json' -o -name 'global-metadata.dat' \) | grep -q .; then
            echo 'raw specimen escaped refined C5 report boundary' >&2
            exit 1
          fi

      - name: Upload refined response wire contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-c5-response-wire-contracts-tail-aware
          path: reports/
          if-no-files-found: error
          retention-days: 14
