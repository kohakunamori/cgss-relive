name: Test preservation domain core

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/server-contracts-11.6.3
    paths:
      - server/domain/**
      - server/adapters/**
      - server/application/**
      - server/application_http.py
      - server/bootstrap_core.py
      - server/domain_server.py
      - server/requirements.txt
      - tests/test_domain_*.py
      - .github/workflows/test-domain-core.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run preservation domain, adapter and application tests
        run: python -m unittest discover -s tests -p 'test_domain_*.py' -v
