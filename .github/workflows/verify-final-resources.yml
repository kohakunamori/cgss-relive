name: Verify final CGSS resources

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-final-resources.yml
      - server/resource_server.py
      - scripts/fetch-resource-bootstrap.py
      - scripts/inspect-resource-manifest.py
      - scripts/inspect-master-db.py
      - scripts/probe-resource-categories.py
      - scripts/archive-resources.py
      - scripts/verify-final-manifest-resolution.py

permissions:
  contents: read

jobs:
  verify-final-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and verify frozen 10133800 manifest and master
        run: |
          python scripts/fetch-resource-bootstrap.py \
            --version 10133800 \
            --output work/final-resource \
            --force

      - name: Inspect manifest without exporting game data
        run: |
          python scripts/inspect-resource-manifest.py \
            work/final-resource/manifest_10133800.db \
            --output work/final-resource/manifest-report.json \
            --unknown-examples 20

      - name: Verify every final manifest name through local resolver
        run: |
          python scripts/verify-final-manifest-resolution.py \
            work/final-resource/manifest_10133800.db \
            --output work/final-resource/name-resolution-report.json

      - name: Build complete content-addressed archive plan
        run: |
          python - <<'PY'
          import collections
          import importlib.util
          import json
          import sys
          from pathlib import Path

          root = Path('work/final-resource')
          script = Path('scripts/archive-resources.py')
          spec = importlib.util.spec_from_file_location('archive_resources_ci', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          plans, skipped = module.load_plan(root / 'manifest_10133800.db')
          categories = collections.Counter(plan.category for plan in plans)
          skipped_statuses = collections.Counter(item.status for item in skipped)
          report = {
              'resource_version': 10133800,
              'planned_unique_objects': len(plans),
              'category_object_counts': dict(sorted(categories.items())),
              'skipped_objects': len(skipped),
              'skipped_status_counts': dict(sorted(skipped_statuses.items())),
          }
          (root / 'archive-plan-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Probe CDN category directories without saving assets
        run: |
          python scripts/probe-resource-categories.py \
            work/final-resource/manifest_10133800.db \
            --allow-unresolved \
            --output work/final-resource/category-probe.json

      - name: Inspect master and starter-card candidates
        run: |
          python scripts/inspect-master-db.py \
            work/final-resource/master.mdb \
            --output work/final-resource/master-report.json \
            --card-id 100001 \
            --card-id 200001 \
            --card-id 300001

      - name: Assert sanitized final-resource invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('work/final-resource')
          bootstrap = json.loads((root / 'resource-bootstrap.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest-report.json').read_text(encoding='utf-8'))
          resolution = json.loads((root / 'name-resolution-report.json').read_text(encoding='utf-8'))
          archive_plan = json.loads((root / 'archive-plan-report.json').read_text(encoding='utf-8'))
          probe = json.loads((root / 'category-probe.json').read_text(encoding='utf-8'))
          master = json.loads((root / 'master-report.json').read_text(encoding='utf-8'))

          assert bootstrap['resource_version'] == 10133800
          assert manifest['quick_check'] == ['ok']
          assert manifest['master_mdb']['hash'] == bootstrap['master']['expected_compressed_md5']
          assert manifest['unknown_category_examples'] == []
          assert resolution['complete'] is True
          assert resolution['rows'] == manifest['rows']
          assert resolution['resolved'] == manifest['rows']
          assert resolution['path_shaped_names'] == manifest['name_shape']['names_with_slash']
          assert resolution['unresolved'] == 0
          assert resolution['mismatched'] == 0
          assert resolution['unknown_category'] == 0
          assert archive_plan['planned_unique_objects'] == manifest['unique_hashes']
          assert archive_plan['skipped_objects'] == 0
          assert master['quick_check'] == ['ok']
          assert master['has_card_data'] is True
          assert master['card_data']['row_count'] > 0
          assert any(card['id'] == 100001 and card['present'] for card in master['requested_cards'])

          expected_direct_routes = {
              '.unity3d': ['AssetBundles'],
              '.acb': ['Sound'],
              '.awb': ['Sound'],
              '.bytes': ['Sound'],
              '.usm': ['Movie'],
              '.mdb': ['Generic'],
          }
          for suffix, expected in expected_direct_routes.items():
              assert probe['suffixes'][suffix]['successful_categories'] == expected, (
                  suffix, probe['suffixes'][suffix]['successful_categories']
              )

          # .bdb remains mapped to Generic from current maintained tooling
          # evidence. The selected final Akamai object currently returns 403 for
          # every category in both tiny probe modes, so preserve that diagnostic
          # instead of pretending it is an independent CDN hit.
          bdb_probe = probe['suffixes']['.bdb']['successful_categories']
          assert bdb_probe in ([], ['Generic'])

          print('resource_version:', bootstrap['resource_version'])
          print('all_dbmanifest_sha256:', bootstrap['index']['sha256'])
          print('manifest_decoded_sha256:', bootstrap['manifest']['decoded_sha256'])
          print('manifest_rows:', manifest['rows'])
          print('manifest_unique_hashes:', manifest['unique_hashes'])
          print('manifest_name_shape:', manifest['name_shape'])
          print('manifest_name_resolution:', resolution)
          print('archive_plan:', archive_plan)
          print('manifest_category_counts:', manifest['category_counts'])
          print('manifest_declared_categories:', manifest.get('declared_category_counts', {}))
          print('cdn_category_probe:', {suffix: item['successful_categories'] for suffix, item in probe['suffixes'].items()})
          print('master_compressed_md5:', bootstrap['master']['expected_compressed_md5'])
          print('master_decoded_sha256:', bootstrap['master']['decoded_sha256'])
          print('master_card_rows:', master['card_data']['row_count'])
          print('starter_candidates:', master['requested_cards'])
          PY

      - name: Remove proprietary databases before artifact upload
        if: always()
        run: |
          rm -f work/final-resource/manifest_10133800.db
          rm -f work/final-resource/master.mdb
          rm -f work/final-resource/all_dbmanifest.txt
          rm -f work/final-resource/*.lz4
          find work/final-resource -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload sanitized verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-resource-verification
          path: |
            work/final-resource/resource-bootstrap.json
            work/final-resource/manifest-report.json
            work/final-resource/name-resolution-report.json
            work/final-resource/archive-plan-report.json
            work/final-resource/category-probe.json
            work/final-resource/master-report.json
          if-no-files-found: warn
          retention-days: 7
