# Native UnityTLS observation points recovered from the exact libunity.so above.
# These record the actual verifier result/failure path and must never be reused
# on another Unity binary without re-establishing the file hash and instruction
# context.
native_points:
  - id: unitytls.default_ca_dispatch
    module: libunity.so
    identity: default-CA verification dispatch path
    rva: 0x00bb0d98
  - id: unitytls.explicit_verify_return
    module: libunity.so
    identity: instruction immediately after explicit verify call
    rva: 0x00bb5b9c
  - id: unitytls.default_verify_return
    module: libunity.so
    identity: instruction immediately after default verify callback
    rva: 0x0166c790
  - id: unitytls.verify_failure
    module: libunity.so
    identity: certificate verification failure block
    rva: 0x0166c2ec
